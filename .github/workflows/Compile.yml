name: RAKIT KERNEL NETHUNTER TISSOT (AUTOMATED)

on:
  workflow_dispatch: # Mengaktifkan tombol manual untuk merakit

jobs:
  build:
    runs-on: ubuntu-20.04 # Menggunakan server Ubuntu asli yang stabil
    steps:
    - name: Clone Source Code Kernel
      uses: actions/checkout@v4

    - name: Pasang Alat Tempur Linux Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev clang lld llvm libncurses-dev git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Modifikasi Kode Otomatis (Injeksi NetHunter & Fix Error)
      run: |
        # 1. Menyisipkan Fitur NetHunter langsung ke file konfigurasi bawaan Mi A1
        cat << EOF >> arch/arm64/configs/tissot_defconfig
        CONFIG_USB_GADGET=y
        CONFIG_USB_G_ANDROID=y
        CONFIG_USB_F_HID=y
        CONFIG_USB_CONFIGFS_F_HID=y
        CONFIG_CONFIGFS_FS=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_DYNAMIC_MINORS=y
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_NETFILTER=y
        CONFIG_ATH_CARDS=y
        CONFIG_ATH9K_HTC=y
        CONFIG_RTL_CARDS=y
        CONFIG_RTL8187=y
        CONFIG_RTL8192CU=y
        CONFIG_RTLxxxu=y
        EOF

        # 2. Mematikan fitur Audio Techpack dan VDSO32 yang memicu eror di kompiler modern
        echo "CONFIG_AUDIO_TECHPACK=n" >> arch/arm64/configs/tissot_defconfig
        echo "CONFIG_TECHPACK_AUDIO=n" >> arch/arm64/configs/tissot_defconfig
        echo "CONFIG_VDSO32=n" >> arch/arm64/configs/tissot_defconfig
        echo "CONFIG_COMPAT_VDSO=n" >> arch/arm64/configs/tissot_defconfig

        # 3. Menyisipkan pengunci fungsi makro langsung ke baris nomor 1 file modpost.c dan sortextable.c
        sed -i '1s/^/#define ELF64_ST_TYPE(val) ((val) \& 0xf)\n#define ELF64_ST_BIND(val) (((val) >> 4) \& 0xf)\n/' scripts/mod/modpost.c
        sed -i '1s/^/#define ELF64_ST_TYPE(val) ((val) \& 0xf)\n#define ELF32_ST_TYPE(val) ((val) \& 0xf)\n#define ELF_ST_TYPE(val) ((val) \& 0xf)\n/' scripts/sortextable.c

    - name: Mulai Kompilasi Kernel Jarak Jauh
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make O=out mrproper
        make O=out tissot_defconfig
        make -j4 O=out

    - name: Unduh Hasil Jadi Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-NetHunter-Tissot-Sukses
        path: out/arch/arm64/boot/Image.gz-dtb
